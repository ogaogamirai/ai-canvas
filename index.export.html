<body class="theme-natural">

  <div id="app-container">
    

    <!-- 🎨 キャンバスペイン -->
    <div id="canvas-pane">
      

      <div id="header">
        <div class="header-row header-main">
          <div class="brand">
            <span>🎨 AI-Canvas</span>
            <span class="badge badge-ipc" title="WebView2 IPC・ポートゼロ">IPC</span>
          </div>
          <div class="toolbar-primary">
            <button type="button" class="btn-icon layout-dir-btn active" data-dir="EDGE" title="エッジ重視整列 (交差最小化 ⇄)" aria-label="エッジ重視整列" onclick="Canvas.autoLayout('EDGE')">⇄</button>
            <button type="button" class="btn-icon layout-dir-btn" data-dir="LR" title="横に整列 (→)" aria-label="横に整列" onclick="Canvas.autoLayout('LR')">→</button>
            <button type="button" class="btn-icon layout-dir-btn" data-dir="BT" title="縦・下から上へ (↑)" aria-label="縦に整列（上向き）" onclick="Canvas.autoLayout('BT')">↑</button>
            <button type="button" class="btn-icon layout-dir-btn" data-dir="TB" title="縦・上から下へ (↓)" aria-label="縦に整列（下向き）" onclick="Canvas.autoLayout('TB')">↓</button>
            <button type="button" class="btn-icon" title="全体表示 (Fit)" aria-label="全体表示" onclick="Canvas.fitView()">⊡</button>
            <button type="button" class="btn-icon" id="theme-btn" title="Cool Cyber へ" aria-label="テーマ切替" onclick="Canvas.toggleTheme()">🌙</button>
            <div class="menu-wrap">
              <button type="button" class="btn-icon" title="その他" aria-label="その他メニュー" onclick="Canvas.toggleHeaderMenu()">⋯</button>
              <div id="header-menu" class="header-menu hidden">
                <button type="button" class="menu-item" onclick="Canvas.clear(); Canvas.toggleHeaderMenu(true)">🧹 リセット</button>
                <button type="button" class="menu-item" onclick="Canvas.exportHTML({ preservePositions: true }); Canvas.toggleHeaderMenu(true)">📌 現在の配置でHTML保存 (完全固定)</button>
                <button type="button" class="menu-item" onclick="Canvas.exportHTML({ preservePositions: false }); Canvas.toggleHeaderMenu(true)">🔄 自動整列モードでHTML保存 (動的)</button>
                <button type="button" class="menu-item" onclick="Canvas.exportJsonCanvas(); Canvas.toggleHeaderMenu(true)">🗂 JSON Canvas 書き出し</button>
                <button type="button" class="menu-item" id="menu-detail-only" onclick="Canvas.toggleDetailOnly()">📄 詳細: 常に開く</button>
              </div>
            </div>
          </div>
        </div>
        <div class="header-row header-log">
          <div id="log-bar">キャンバス準備完了。AIの思考描画を待機中...</div>
        </div>
      </div>

      <!-- 📄 詳細パネル (Side Slide-in Drawer) -->
      <div id="detail-panel">
        <div class="panel-header">
          <div style="display:flex; align-items:center; gap:8px;">
            <span id="panel-type-badge" class="panel-badge">CARD</span>
            <span id="panel-node-id" style="font-size:12px; font-family:monospace; color:var(--log-color);">#id</span>
          </div>
          <div style="display:flex; align-items:center; gap:2px;">
            
            <button class="panel-close-btn" onclick="Canvas.closeDetailPanel()" title="閉じる (Esc)">✕</button>
          </div>
        </div>
        <div id="panel-body" class="panel-content"></div>
        <div class="panel-footer">
          <span id="panel-connections">🔗 接続: なし</span>
          <span style="font-size:10px; opacity:0.7;">キー: [↑↓←→] 移動 / [Esc] 閉じる</span>
        </div>
      </div>

      <div id="help-overlay" role="dialog" aria-label="ショートカットヘルプ" onclick="if(event.target===this)Canvas.toggleHelp(false)">
        <div class="help-card" onclick="event.stopPropagation()">
          <h2>ショートカット</h2>
          <p><kbd>↑↓←→</kbd> 近傍ノードへフォーカス（詳細パネルが開いているときだけ内容も更新）</p>
          <p><kbd>Esc</kbd> 詳細パネルを閉じる（選択リングは維持）</p>
          <p><kbd>?</kbd> このヘルプの表示 / 閉じる</p>
          <p style="margin-top:12px;font-size:11px;color:var(--log-color);">ノードをクリックすると詳細パネルを開きます。</p>
          <button type="button" class="btn-icon" style="margin-top:14px;width:100%;" onclick="Canvas.toggleHelp(false)">閉じる</button>
        </div>
      </div>

      

      <svg id="canvas">
        <defs>
          <!-- グリッド -->
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-line" />
          </pattern>
          <!-- 矢印マーカー -->
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path id="arrow-path" d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--arrow-fill)" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- レイヤー（SVG は後から来る兄弟が上に描画される → エッジをノードより手前に） -->
        <g id="objects-layer"></g>
        <path id="temp-edge" />
        <g id="edges-layer"></g>
      </svg>
    </div> <!-- /#canvas-pane -->
  </div> <!-- /#app-container -->

  <script type="text/plain" id="canvas-initial-dsl" data-encoding="base64"></script>
